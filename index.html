<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Left side - Login Form -->
        <div class="left-side">
            <div class="login-container">
                <h1 class="title">Welcome Back</h1>
                <p class="subtitle">Please login to your account</p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <input type="email" id="email" required>
                        <label for="email">Email</label>
                        <span class="focus-border"></span>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" id="password" required>
                        <label for="password">Password</label>
                        <span class="focus-border"></span>
                    </div>
                    
                    <div class="options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember">
                            <label for="remember">
                                <span class="checkbox"></span>
                                Remember Me
                            </label>
                        </div>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="login-btn" id="loginBtn">
                        <span>Login</span>
                        <div class="ripple"></div>
                    </button>
                    
                    <div class="signup-link">
                        Don't have an account? <a href="#" id="signupBtn">Sign Up</a>
                    </div>
                </form>
            </div>
            
            <div class="footer">
                <p class="developer-credit">Developed by <span class="gradient-text">Ashwanth</span> <span class="heart">❤</span></p>
                <div class="underscore"></div>
            </div>
        </div>
        
        <!-- Right side - Welcome Message -->
        <div class="right-side">
            <div class="welcome-message">
                <h1>Hello, Friend!</h1>
                <p>Enter your personal details and start your journey with us</p>
                <button class="ghost-btn" id="signupBtn2">Sign Up</button>
            </div>
        </div>
        
        <!-- Audio Controls -->
        <div class="audio-controls">
            <button id="muteBtn" class="audio-btn">🔊</button>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
        </div>
        
        <!-- Floating Shapes -->
        <div class="shape circle"></div>
        <div class="shape triangle"></div>
        <div class="shape square"></div>
        
        <!-- Bubbles -->
        <div class="bubbles">
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
